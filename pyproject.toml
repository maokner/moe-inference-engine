[project]
name = "moe-engine"
version = "0.1.0"
description = "From-scratch inference engine serving miniMoE: paged KV cache, continuous batching, fused MoE kernels."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5",
    "tiktoken>=0.8",
    "numpy>=2",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.32"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moe_engine"]
